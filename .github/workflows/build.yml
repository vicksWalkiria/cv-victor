name: Build and Deploy CV Portfolio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra latexmk curl unzip

      - name: Install Fira Sans Font
        run: |
          curl -L -o fira-sans.zip "https://fonts.google.com/download?family=Fira%20Sans"
          unzip fira-sans.zip -d fira-sans
          mkdir -p ~/.local/share/fonts
          cp fira-sans/*.ttf ~/.local/share/fonts/
          fc-cache -f -v

      - name: Compile Resumes
        run: make all

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-cvs
          path: dist/*.pdf
          if-no-files-found: error

      - name: Prepare Static Website Files
        run: |
          mkdir -p web/dist web/assets
          cp dist/*.pdf web/dist/
          cp src/cv-victor-llm-*.md web/dist/
          if [ -f assets/victor-profile.png ]; then
            cp assets/victor-profile.png web/assets/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

